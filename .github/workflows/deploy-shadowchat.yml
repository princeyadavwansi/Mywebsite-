name: Build and deploy ShadowChat
on:
  push:
    branches: [main]
    paths:
      - "shadowchat/**"
      - ".github/workflows/deploy-shadowchat.yml"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: shadowchat
        run: npm install
      - name: Build ShadowChat
        working-directory: shadowchat
        run: npm run build
      - name: Prepare site (preserve existing homepage)
        run: |
          mkdir -p _site/shadowchat _site/chat
          cp index.html _site/index.html
          cp -a shadowchat/dist/. _site/shadowchat/
          cat > _site/chat/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0;url=/Mywebsite-/shadowchat/">
            <title>Open Chatbot</title>
          </head>
          <body>
            <p>Opening chatbot… <a href="/Mywebsite-/shadowchat/">Tap here if it doesn't open</a>.</p>
            <script>location.replace("/Mywebsite-/shadowchat/");</script>
          </body>
          </html>
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
